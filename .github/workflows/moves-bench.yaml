name: moves-bench

# Experiment for #232, not merged: dispatch's cost of a tick of drivers.moved
# by step and candidate option (scratch/moves-bench.ts).
on:
  push:
    branches: [232-exp-dispatch-profile]

jobs:
  bench:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        attempt: [1, 2]
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: |
          echo "cpu: $(grep -m1 'model name' /proc/cpuinfo | cut -d: -f2)"
          echo "runner: $(nproc) cpus; load average: $(cut -d' ' -f1-3 /proc/loadavg)"
          bun scratch/moves-bench.ts 325000 30
          bun scratch/moves-bench.ts 400000 30
          echo "load average: $(cut -d' ' -f1-3 /proc/loadavg)"
