name: ab

# Experiment only (#233, never merged): master and this branch's bench
# alternately on one runner, so both see the same CPU.
on:
  push:
    branches: [233-exp-paired-bench]

permissions:
  contents: read

jobs:
  ab:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        job: [1, 2, 3]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: git worktree add ../master origin/master && cp -r node_modules ../master/
      - name: A/B
        env:
          ROUNDS: 2
        run: |
          grep -m1 "model name" /proc/cpuinfo
          for run in "50000 greedy" "50000 batched" "200000 greedy"; do
            set -- $run
            for round in $(seq 1 "$ROUNDS"); do
              for side in master branch; do
                dir=.; [ "$side" = master ] && dir=../master
                line=$(cd "$dir" && bun src/bench/main.ts --drivers "$1" --ticks 600 --matching "$2" | grep -E "wall ms|peak rss" | tr '\n' ' ')
                echo "$1 $2 round $round $side $line"
              done
            done
          done
