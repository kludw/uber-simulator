name: ci

on:
  pull_request:
  push:
    branches: [master]

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      # For the ClickHouse adapter integration tests; same image and
      # healthcheck as compose.yaml.
      clickhouse:
        image: clickhouse/clickhouse-server:26.9.8.3
        ports:
          - 8123:8123
        env:
          CLICKHOUSE_USER: sim
          CLICKHOUSE_PASSWORD: sim
          CLICKHOUSE_DB: sim
        options: >-
          --ulimit nofile=262144:262144
          --health-cmd "wget -q --spider http://localhost:8123/ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      NATS_URL: nats://localhost:4222
      CLICKHOUSE_URL: http://localhost:8123
      CLICKHOUSE_USER: sim
      CLICKHOUSE_PASSWORD: sim
      CLICKHOUSE_DB: sim
    steps:
      - uses: actions/checkout@v5
      # NATS for the bus and persister integration tests, with JetStream: run
      # with infra/nats.conf, like compose.yaml. Not a service container,
      # which can't mount a file from the checkout.
      - name: Start NATS
        run: |
          docker run -d --name nats -p 4222:4222 -p 8222:8222 \
            -v "$PWD/infra/nats.conf:/etc/nats/nats-server.conf:ro" \
            nats:2.15.0-alpine
          timeout 60 sh -c 'until curl -sf http://localhost:8222/healthz; do sleep 1; done'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test
