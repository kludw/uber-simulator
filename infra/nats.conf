# Local dev NATS server. Syntax: https://docs.nats.io/running-a-nats-service/configuration
port: 4222
monitor_port: 8222

# Persister stream (ADR 0028). /data is the compose named volume.
jetstream {
  store_dir: /data
}

# Browser UI connects here (ADR 0020). Plain ws:// for local only.
websocket {
  port: 9222
  no_tls: true
}
